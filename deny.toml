# cargo-deny: licenze ammesse (compatibili con GPL-2.0-or-later, vedi docs/adr/0001-licenza.md)
[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
    "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "GPL-2.0-or-later", "GPL-3.0-or-later",
    "LGPL-2.1-or-later", "OpenSSL", "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
