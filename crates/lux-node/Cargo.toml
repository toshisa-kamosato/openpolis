[package]
name = "lux-node"
description = "openpolis node: network state in SQLite, administrator, PIN invitations, sign-up, local web API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] } # OS randomness for salts, tokens and PINs
hmac = "0.12"
sha2 = "0.10"
tiny_http = "0.12"
lux-economy.workspace = true
ed25519-dalek = "2"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
hkdf = "0.12"
ureq = { version = "2", default-features = false }
