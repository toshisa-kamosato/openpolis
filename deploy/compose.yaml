# openpolis — the services of one node (ADR-0022).
# DRAFT, NOT TESTED: written from the documentation of each image; it has never been started. See README.md.
# `luxd` itself runs on the host (systemd), not here: it needs `docker exec` and the Docker socket must not be
# given to a container. Every container publishes only on 127.0.0.1; Caddy (host network) is the only door.
name: openpolis

services:
  caddy:
    image: caddy:2
    container_name: openpolis-proxy
    restart: unless-stopped
    network_mode: host # ports 80 and 443; reaches everything on 127.0.0.1
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  mail: # docker-mailserver: Postfix + Dovecot. Accounts are created by `luxd` with `setup email add`.
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: openpolis-mail
    hostname: mail.${DOMAIN}
    restart: unless-stopped
    ports: ["25:25", "465:465", "587:587", "993:993"]
    environment:
      OVERRIDE_HOSTNAME: mail.${DOMAIN}
      ENABLE_QUOTAS: "1"
      ENABLE_CLAMAV: "0"
      ENABLE_SPAMASSASSIN: "0"
      ONE_DIR: "1"
      # the certificate is the one Caddy obtains for mail.${DOMAIN}
      SSL_TYPE: manual
      SSL_CERT_PATH: /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.${DOMAIN}/mail.${DOMAIN}.crt
      SSL_KEY_PATH: /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.${DOMAIN}/mail.${DOMAIN}.key
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      - mail_config:/tmp/docker-mailserver
      - caddy_data:/caddy:ro

  webmail:
    image: roundcube/roundcubemail:latest
    container_name: openpolis-webmail
    restart: unless-stopped
    ports: ["127.0.0.1:8081:80"]
    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mail.${DOMAIN}
      ROUNDCUBEMAIL_DEFAULT_PORT: "993"
      ROUNDCUBEMAIL_SMTP_SERVER: ssl://mail.${DOMAIN}
      ROUNDCUBEMAIL_SMTP_PORT: "465"
    volumes:
      - roundcube_db:/var/roundcube/db

  matrix: # Synapse; the configuration is generated by install.sh in ./synapse
    image: matrixdotorg/synapse:latest
    container_name: openpolis-matrix
    restart: unless-stopped
    ports: ["127.0.0.1:8008:8008"]
    volumes:
      - ./synapse:/data

  element:
    image: vectorim/element-web:latest
    container_name: openpolis-element
    restart: unless-stopped
    ports: ["127.0.0.1:8082:80"]
    volumes:
      - ./element-config.json:/app/config.json:ro

  db:
    image: mariadb:11
    container_name: openpolis-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql

  wordpress: # one WordPress Multisite (sub-domains): one site per member, 3 GB each (blog_upload_space)
    image: wordpress:latest
    container_name: openpolis-blog
    restart: unless-stopped
    depends_on: [db]
    ports: ["127.0.0.1:8083:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ALLOW_MULTISITE', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
    volumes:
      - wp_data:/var/www/html

  wpcli:
    image: wordpress:cli
    container_name: openpolis-wpcli
    restart: unless-stopped
    depends_on: [db]
    user: "33:33"
    command: ["tail", "-f", "/dev/null"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wp_data:/var/www/html

volumes:
  caddy_data:
  caddy_config:
  mail_data:
  mail_state:
  mail_logs:
  mail_config:
  roundcube_db:
  db_data:
  wp_data:
